name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ">=0.13.4"

      - name: "Check minimum safe dependency versions"
        run: uv run --no-project python scripts/check_min_versions.py --no-env

      - name: Deploy
        run: uvx --with mkdocs-material mkdocs gh-deploy --force
